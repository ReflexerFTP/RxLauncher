[package]
name = "rxlauncher"
version = "3.13.0"
description = "RxLauncher — Minecraft launcher"
authors = ["RxLauncher"]
license = "GPL-3.0-only"
edition = "2021"
rust-version = "1.80"

[lib]
name = "rxlauncher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Сборка для отладки интерфейса: UI с локального сервера (RX_WEB_ROOT), DevTools в release
devui = ["tauri/devtools"]

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "process", "net", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "gzip", "brotli", "deflate", "stream", "http2", "charset"] }
futures-util = "0.3"
bytes = "1"
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
hex = "0.4"
base64 = "0.22"
flate2 = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
dunce = "1"
rand = "0.8"
aes-gcm = "0.10"
winreg = "0.52"
arboard = { version = "3", default-features = false }
trash = "5"
percent-encoding = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_Storage_FileSystem",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
