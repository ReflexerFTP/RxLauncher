name: Tauri build

on:
  push:
    branches: [tauri]
    paths: ["src-tauri/**", "tauri/**", "web/**", ".github/workflows/tauri.yml", "*.js", "package.json"]
  workflow_dispatch:
    inputs:
      bundle:
        description: "Собрать и установщик (NSIS)"
        type: boolean
        default: false
      release_run:
        description: "Выпустить релиз из готовой сборки: ID запуска с установщиком (пусто — обычная сборка)"
        type: string
        default: ""

concurrency:
  group: tauri-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.release_run == '' }}
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # Подпись кода SignPath включается сама, когда в репозитории есть секрет и переменная (см. tauri/SIGNPATH.md)
      SIGNPATH_ENABLED: ${{ secrets.SIGNPATH_API_TOKEN != '' && vars.SIGNPATH_ORGANIZATION_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: rxlauncher-tauri

      - name: JS tools (ejs, jquery, toml, Tauri CLI)
        shell: bash
        run: |
          npm install --prefix tauri/.deps --no-audit --no-fund ejs@3.1.10 jquery@3.7.1 toml@npm:@iarna/toml@2.2.5 mcnbt@2.0.3 @tauri-apps/cli@2

      - name: Runtime tests
        shell: bash
        run: |
          node tauri/tests/path.test.cjs
          node tauri/tests/buffer.test.cjs

      - name: Build UI
        shell: bash
        env:
          RX_NODE_MODULES: tauri/.deps/node_modules
        run: node tauri/build-ui.cjs

      - name: Build dev exe (UI from 127.0.0.1:1420)
        shell: bash
        run: |
          node tauri/.deps/node_modules/@tauri-apps/cli/tauri.js build --no-bundle --features devui --config tauri/dev/tauri.dev.json
          mkdir -p out
          cp "src-tauri/target/release/RxLauncher.exe" "out/RxLauncher-dev.exe"

      - name: Build release installer
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.bundle }}
        shell: bash
        run: |
          node tauri/.deps/node_modules/@tauri-apps/cli/tauri.js build
          cp src-tauri/target/release/bundle/nsis/*.exe out/
          # Красивый установщик (окно RxSetup) поверх NSIS — основной файл для скачивания
          node tauri/build-setup.cjs "$(ls src-tauri/target/release/bundle/nsis/*_x64-setup.exe)" out

      - name: Upload unsigned installers for SignPath
        id: unsigned
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.bundle && env.SIGNPATH_ENABLED == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: rxlauncher-unsigned
          path: |
            out/*_x64-setup.exe
            out/RxLauncher Setup *.exe
          retention-days: 1

      - name: Sign installers (SignPath)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.bundle && env.SIGNPATH_ENABLED == 'true' }}
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'RxLauncher' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_SLUG || 'installers' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1800
          output-artifact-directory: out-signed

      - name: Use signed installers
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.bundle && env.SIGNPATH_ENABLED == 'true' }}
        shell: pwsh
        run: |
          Copy-Item out-signed/*.exe out/ -Force
          Get-ChildItem out -Filter *.exe | ForEach-Object { '{0}: {1}' -f $_.Name, (Get-AuthenticodeSignature $_.FullName).Status }

      - name: Sign update manifest
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.bundle }}
        shell: bash
        env:
          RX_UPDATE_SIGNING_KEY: ${{ secrets.RX_UPDATE_SIGNING_KEY }}
        run: node tauri/sign-update.cjs out

      # Отдельно только красивый установщик — его и скачивают (медленный интернет)
      - name: Upload setup
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.bundle }}
        uses: actions/upload-artifact@v4
        with:
          name: rxlauncher-setup
          path: out/RxLauncher Setup *.exe
          compression-level: 0
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: rxlauncher-tauri
          path: out/
          compression-level: 9
          retention-days: 14

      - name: Core tests (Rust)
        shell: bash
        run: cargo test --release --features devui --manifest-path src-tauri/Cargo.toml

  # Релиз из уже собранных и проверенных установщиков (артефакт rxlauncher-tauri указанного запуска)
  release:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_run != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Download installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${{ inputs.release_run }}" -R "${{ github.repository }}" -n rxlauncher-tauri -D out
          ls -la out

      - name: Sign update manifest
        env:
          RX_UPDATE_SIGNING_KEY: ${{ secrets.RX_UPDATE_SIGNING_KEY }}
        run: node tauri/sign-update.cjs out

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          sha=$(gh run view "${{ inputs.release_run }}" -R "${{ github.repository }}" --json headSha -q .headSha)
          node tauri/release-notes.cjs > notes.md
          files=("out/RxLauncher Setup ${version}.exe" out/RxLauncher_${version}_x64-setup.exe)
          if [ -f out/rxlauncher-tauri-update.json ]; then files+=(out/rxlauncher-tauri-update.json); fi
          for file in "${files[@]}"; do test -f "$file" || { echo "Missing $file"; exit 1; }; done
          gh release create "v${version}" "${files[@]}" -R "${{ github.repository }}" --target "$sha"             --title "RxLauncher ${version} — $(node -p "require('vm').runInNewContext(require('fs').readFileSync('web/js/RxPatchNotes.js','utf8')+';RxPatchNotes.ITEMS[0].title.ru',{RxConfig:{read:()=>'ru'}})")"             --notes-file notes.md --latest
